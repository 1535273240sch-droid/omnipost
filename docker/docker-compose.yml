version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnipost_postgres
    environment:
      POSTGRES_DB: omnipost_db
      POSTGRES_USER: omnipost
      POSTGRES_PASSWORD: omnipost_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: omnipost_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
